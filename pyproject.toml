[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transkrp"
version = "0.1.0"
description = "Fetch a YouTube transcript as readable markdown, with a timestamp on every paragraph"
readme = "README.md"
# 3.10 because both dependencies floor there; nothing in the code needs it.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "unoriginalnickname", email = "aadammatthews@gmail.com" }]
keywords = [
    "youtube", "transcript", "transcripts", "subtitles", "captions",
    "markdown", "yt-dlp", "speech-to-text", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = ["yt-dlp>=2026.7.4"]

[project.optional-dependencies]
# --speakers only. The core stays on its single dependency: fetching a
# transcript needs neither of these, and most people never run attribution.
speakers = ["nameparser>=1.1", "rapidfuzz>=3"]
# --- podcasts only. Everything above this line is a few hundred kilobytes;
# faster-whisper brings CTranslate2, av, tokenizers and onnxruntime, which is
# hundreds of megabytes. Finding a feed and listing its episodes needs none of
# it — only transcribing does, so the import sits inside that one function.
podcast = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "nameparser>=1.1", "rapidfuzz>=3"]

[project.scripts]
transkrp = "transkrp:cli"

[project.urls]
Homepage = "https://github.com/unoriginalnickname/transkrp"
Source = "https://github.com/unoriginalnickname/transkrp"
Issues = "https://github.com/unoriginalnickname/transkrp/issues"

[tool.setuptools]
# `sponsors` and `podcast` ship with the core: both are stdlib only, and transkrp
# imports them at module level. `podcast` earns its place there because finding a
# feed and listing episodes needs nothing extra; its one heavy import (whisper)
# is inside the function that transcribes. `speakers`, `ontology` and `graph` are
# deliberately absent — they need the [speakers] extras and are imported lazily,
# inside the functions that use them, so an install without the extras still runs.
py-modules = ["transkrp", "sponsors", "podcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tests are deselected by default: they need the network, they are slow,
# and YouTube rate-limits repeated runs. Run them deliberately:
#     python -m pytest -m network
addopts = '-m "not network"'
markers = ["network: really hits YouTube (see tests/test_live.py)"]
