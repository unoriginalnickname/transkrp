[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transkrp"
version = "0.1.0"
description = "Fetch a YouTube transcript as readable, timestamped markdown"
readme = "README.md"
# 3.10 because both dependencies floor there; nothing in the code needs it.
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2026.7.4"]
# No license declared: there's no LICENSE file in the repo, and inventing one
# would be a claim about the author's intent rather than a packaging detail.

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transkrp = "transkrp:cli"

[project.urls]
Source = "https://github.com/unoriginalnickname/transkrp"

[tool.setuptools]
py-modules = ["transkrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tests are deselected by default: they need the network, they are slow,
# and YouTube rate-limits repeated runs. Run them deliberately:
#     python -m pytest -m network
addopts = '-m "not network"'
markers = ["network: really hits YouTube (see tests/test_live.py)"]
